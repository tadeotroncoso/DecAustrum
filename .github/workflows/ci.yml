name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements/bootstrap.lock
            requirements/dev.lock
            pyproject.toml
            sdk/python/pyproject.toml

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade --require-hashes --no-deps \
            --only-binary=:all: \
            --requirement requirements/bootstrap.lock
          python -m pip install --require-hashes --no-deps \
            --requirement requirements/dev.lock
          python -m pip check

      - name: Validate POSIX automation
        run: |
          for script in scripts/*.sh; do
            sh -n "$script"
          done

      - name: Audit dependencies, source, and secrets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip_audit \
            --requirement requirements/dev.lock \
            --require-hashes \
            --disable-pip \
            --progress-spinner off
          if ! bandit_output=$(python -m bandit \
            --recursive \
            app \
            sdk/python/src \
            scripts \
            --quiet 2>&1); then
            printf '%s\n' "$bandit_output" >&2
            exit 1
          fi
          python scripts/validate_secrets_baseline.py .secrets.baseline
          git ls-files --cached --others --exclude-standard -z | \
            xargs -0 detect-secrets-hook \
              --baseline .secrets.baseline \
              --no-verify \
              --exclude-files \
                '^\.(bandit-baseline\.json|secrets\.baseline)$'

      - name: Run lint and static type checks
        run: |
          python -m ruff check app sdk/python/src scripts tests
          python -m mypy

      - name: Run complete test and coverage suite
        run: >-
          python -m pytest -q -p no:cacheprovider
          --cov=app --cov=decaustrum --cov-branch
          --cov-report=term-missing

      - name: Build SDK wheel
        run: >-
          python -m pip wheel ./sdk/python --no-deps
          --no-build-isolation --wheel-dir dist

      - name: Upload Python wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decaustrum-python-wheels
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          queries: security-extended

      - name: Analyze Python and workflow security
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  container-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test-and-package
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          version: v0.74.0

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build pinned runtime image
        run: docker build --tag decaustrum-backend:ci .

      - name: Reject high and critical runtime vulnerabilities, including unfixed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: decaustrum-backend:ci
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.74.0
          skip-setup-trivy: true

      - name: Verify hardened runtime, authorization, and worker
        shell: bash
        run: |
          set -euo pipefail
          container_name="decaustrum-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume_name="decaustrum-smoke-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
            docker volume rm "$volume_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume_name"
          docker run --detach \
            --name "$container_name" \
            --env-file .env \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=16m,mode=1777 \
            --volume "$volume_name:/app/data" \
            --publish 127.0.0.1:8000:8000 \
            decaustrum-backend:ci

          ready=false
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$container_name")" = healthy ] \
              && curl --fail --silent \
                http://127.0.0.1:8000/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            docker logs "$container_name"
            exit 1
          fi

          docker exec --interactive "$container_name" python - <<'PY'
          import json
          import os
          import sqlite3
          import ssl
          import sys
          from importlib.metadata import distributions
          from importlib.util import find_spec
          from shutil import which
          from urllib.request import Request, urlopen

          import pydantic_core
          import yaml

          def verify_runtime_installers_absent():
              for name in ("pip", "ensurepip", "setuptools", "wheel"):
                  assert find_spec(name) is None, f"Unexpected installer module: {name}"
              for distribution in distributions():
                  name = distribution.metadata["Name"].lower().replace("_", "-")
                  assert name not in {"pip", "setuptools", "wheel"}, (
                      f"Unexpected installer distribution: {name}"
                  )
              for name in ("pip", "pip3", "pip3.12"):
                  assert which(name) is None, f"Unexpected installer command: {name}"

          verify_runtime_installers_absent()
          assert sys.version_info[:2] == (3, 12)
          assert os.geteuid() == 10001
          assert pydantic_core.__version__
          assert yaml.safe_load("ready: true") == {"ready": True}
          assert ssl.create_default_context().get_ca_certs()
          with sqlite3.connect(":memory:") as connection:
              assert connection.execute("SELECT 1").fetchone() == (1,)

          headers = {
              "Content-Type": "application/json",
              "X-API-Key": os.environ["DECAUSTRUM_API_KEY"],
          }
          request = Request(
              "http://127.0.0.1:8000/v1/authorize",
              data=json.dumps({
                  "agent": "container-smoke",
                  "action": "container_smoke_unconfigured_action",
                  "context": {},
              }).encode("utf-8"),
              headers=headers,
              method="POST",
          )
          with urlopen(request, timeout=5) as response:
              decision = json.loads(response.read())
          assert decision["decision"] == "DENY"
          assert decision["policy"] is None

          request = Request(
              "http://127.0.0.1:8000/v1/decisions/" + decision["decision_id"],
              headers=headers,
          )
          with urlopen(request, timeout=5) as response:
              assert json.loads(response.read()) == decision
          print("Non-root runtime, compiled dependencies, and authorization passed.")
          PY
          docker exec "$container_name" python -m app.webhook_worker --once
