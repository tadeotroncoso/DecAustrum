[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decaustrum-sdk"
version = "0.1.0"
description = "Official Python SDK for the DecAustrum authorization API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Tadeo Adrián Troncoso Taraborrelli", email = "35420076+tadeotroncoso@users.noreply.github.com"},
]
license = "LicenseRef-DecAustrum-Portfolio-Evaluation-1.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = [
    "authorization",
    "ai-agents",
    "policy-engine",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decaustrum = ["py.typed"]
