[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decaustrum-backend"
version = "0.1.0"
description = "Project-scoped authorization, human approval, and verifiable decision evidence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Tadeo Adrián Troncoso Taraborrelli", email = "35420076+tadeotroncoso@users.noreply.github.com"},
]
keywords = [
    "authorization",
    "ai-agents",
    "policy-engine",
    "human-approval",
    "audit-evidence",
    "webhooks",
]
license = "LicenseRef-DecAustrum-Portfolio-Evaluation-1.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "uvicorn==0.52.1",
]

[project.scripts]
decaustrum-webhook-worker = "app.webhook_worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
