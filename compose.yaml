name: decaustrum

x-decaustrum-service: &decaustrum-service
  build:
    context: .
  image: decaustrum-backend:0.1.0
  env_file:
    - .env
  volumes:
    - decaustrum-data:/app/data
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  restart: unless-stopped

services:
  api:
    <<: *decaustrum-service
    ports:
      - "127.0.0.1:${DECAUSTRUM_PORT:-8000}:8000"

  webhook-worker:
    <<: *decaustrum-service
    command:
      - python
      - -m
      - app.webhook_worker
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  decaustrum-data:
    name: decaustrum-data
